version: '3'

vars:
  SCRIPTS: verify-release-tag/verify.sh render-docs/render.sh publish-release/publish.sh test/verify_test.sh test/publish_test.sh test/render_test.sh

tasks:
  lint:
    cmds:
      - actionlint
      - shellcheck {{.SCRIPTS}}
  test:
    desc: The render and publish tests need Docker and spec-validator. Writes the time of each script to build/test/durations.txt.
    cmds:
      - |
        set -e
        mkdir -p build/test
        : >build/test/durations.txt
        for script in test/verify_test.sh test/publish_test.sh test/render_test.sh; do
          start=$(date +%s)
          bash "$script"
          echo "$script: $(($(date +%s) - start)) s" | tee -a build/test/durations.txt
        done
  validate-specs:
    cmds:
      - .agents/skills/spec-system/bin/validate-specs
  check:
    cmds:
      - task: lint
      - task: test
      - task: validate-specs
